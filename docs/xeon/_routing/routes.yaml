# Xeon 문서 라우팅 표. 사람용 설명은 README.md.
# 해석기: xeon/scripts/docs-route.ts (P3에서 구현).
# 규칙: 작업 유형 묶음 + 코드 경로가 맞는 문서(binds) + 그 문서의 depends_on 한 단계.

version: 1

# 작업 유형별로 항상 읽는 문서 (id)
by_task:
  implement:          # 코드를 쓰거나 고치는 모든 작업
    - eng.dependency-rules.guide
    - eng.typescript.guide
    - eng.domain-types.guide
    - eng.anti-patterns.guide
    - eng.best-practices.guide
    - eng.testing.guide
    - eng.toolchain.guide
  data:               # 저장, 이벤트, 재생, 원자성을 건드리는 작업 (implement에 더함)
    - eng.transactions.design
    - eng.events.design
    - eng.context-map.design
  extension:          # 확장 지점, 플러그인, 그룹을 건드리는 작업
    - X.readme
    - X.primitives.spec
    - F.extensions.spec
  docs:               # 문서를 쓰거나 고치는 작업
    - xeon.templates
    - xeon.readme
  review:             # 정합성 검토. 코드 리뷰는 implement와 함께 지정한다
    - architecture.layers.spec
    - eng.dependency-rules.guide
    - eng.context-map.design
    - eng.typescript.guide
    - eng.anti-patterns.guide

# 층·도메인 → 코드 경로. 문서의 binds와 같아야 한다 (검사 대상).
layout:
  F:
    package: xeon/packages/contracts
    domains: [conversation, records, capabilities, extensions, wire-settings]
    path: "xeon/packages/contracts/src/{domain}/**"
    # 도메인 밖 서브패스. services는 도메인이 아니고 F.capabilities가 배치 규칙을 정한다
    # (F.capabilities.spec §3.12, review.decisions-2 D-04). 이 경로를 binds로 쓰는 문서는 F.capabilities spec·plan이다.
    paths:
      services: "xeon/packages/contracts/src/services/**"
  X:
    package: xeon/packages/ext-host
    domains: [loading-trust, primitives, operations]
    path: "xeon/packages/ext-host/src/{domain}/**"
  L0:
    domains: [exec, sandbox, secrets, process, store, os]
    path: "xeon/packages/platform-{domain}/**"
  L1:
    domains: [tasks, loop, models, tools, context, persistence, agents]
    path: "xeon/packages/core-{domain}/**"
  L2:
    domains: [workspace, mcp, web, knowledge, work, dialog, artifacts, schedule]
    path: "xeon/packages/cap-{domain}/**"
  L3:
    domains: [group-kit, helm, learning, slots]
    paths:
      group-kit: "xeon/packages/group-kit/**"
      helm: "xeon/packages/group-helm/**"
      learning: "xeon/packages/group-learning/**"
      # slots는 코드 없음 (템플릿 문서만)
  L4:
    domains: [cli, desktop, host-service, settings-ui]
    paths:
      cli: "xeon/apps/cli/**"
      desktop: "xeon/apps/desktop/**"
      host-service: "xeon/apps/host/**"
      settings-ui: "xeon/packages/client/src/settings/**"   # view-model(adr.0020). 렌더러는 xeon/apps/desktop/src/views
  plugins:
    - path: "xeon/plugins/provider-anthropic-oauth/**"
      docs: [L1.readme, L1.models.spec, L1.models.plan]
  # 층 밖 코드 경로. layout에 자기 층 항목이 없는 문서(architecture, adr, eng)의 binds 허용 목록이다.
  # 검사기는 이런 문서에 layout 전체의 경로를 허용하므로 여기 적은 경로가 그 집합에 더해진다.
  # domains는 경로 이름표이고 문서 도메인이 아니다. layer가 shared인 문서는 두지 않는다.
  shared:
    domains:
      - workspace
      - packages
      - apps
      - plugins
      - vendor-cordis
      - check-layers
      - depcruise-config
      - root-package
      - bunfig
      - turbo
      - tsconfig-base
      - oxlint-config
      - oxfmt-config
      - lefthook
      - justfile
      - ci-workflow
      - ts-sources
      - tsx-sources
      - test-files
      - test-dirs
      - testing-dirs
      - desktop-src
      - client-package
      - dependency-allowlist
    paths:
      workspace: "xeon/**"
      packages: "xeon/packages/**"
      apps: "xeon/apps/**"
      plugins: "xeon/plugins/**"
      vendor-cordis: "xeon/vendor/cordis/**"
      check-layers: "xeon/scripts/check-layers.ts"
      depcruise-config: "xeon/.dependency-cruiser.cjs"
      root-package: "xeon/package.json"
      bunfig: "xeon/bunfig.toml"
      turbo: "xeon/turbo.json"
      tsconfig-base: "xeon/tsconfig.base.json"
      oxlint-config: "xeon/.oxlintrc.json"
      oxfmt-config: "xeon/.oxfmtrc.json"
      lefthook: "xeon/lefthook.yml"
      justfile: "xeon/justfile"
      ci-workflow: ".github/workflows/xeon-ci.yml"
      ts-sources: "xeon/**/*.ts"
      tsx-sources: "xeon/**/*.tsx"
      test-files: "xeon/**/*.test.ts"
      test-dirs: "xeon/**/test/**"
      testing-dirs: "xeon/packages/*/src/testing/**"
      # 데스크톱 WebView TS 소스. eng.frontend-state.guide가 쓴다. 다른 UI 코드는 tsx-sources로 잡는다
      desktop-src: "xeon/apps/desktop/src/**"
      # L4 공유 클라이언트 패키지(adr.0020). L4 도메인 문서가 생기기 전까지 ADR binds용으로 둔다
      client-package: "xeon/packages/client/**"
      dependency-allowlist: "xeon/scripts/dependency-allowlist.json"

# 산출 문서 목록 (작성 대상). id는 <층>.<도메인>.<종류>.
manifest:
  product: [product.vision.spec, product.usecases.spec, product.scope.spec]
  architecture: [architecture.overview.spec, architecture.layers.spec, architecture.runtime-flow.design]
  engineering:
    - eng.dependency-rules.guide
    - eng.typescript.guide
    - eng.domain-types.guide
    - eng.context-map.design
    - eng.transactions.design
    - eng.events.design
    - eng.anti-patterns.guide
    - eng.best-practices.guide
    - eng.testing.guide
    - eng.toolchain.guide
    - eng.frontend-state.guide
  decisions:
    - adr.0001   # 스택(Bun, TS7, oxlint/oxfmt, bun test, turbo)
    - adr.0002   # DI는 Cordis 하나
    - adr.0003   # pi durable 부분 포크, 커널 자체 구현
    - adr.0004   # 세션 저장 C안(SQLite 이벤트 소싱 + 투영, 단일 DB)
    - adr.0005   # 무료 웹 검색 기본값
    - adr.0006   # 프로세스 구조와 서비스 모드(데몬)
    - adr.0007   # 확장 지점 4연산(on/post/drive/scope)
    - adr.0008   # 데스크톱 Tauri 2 + 엔진 사이드카
    - adr.0009   # 자체 에이전트 루프(pi-agent-core 루프 포크, 의존 제거)
    - adr.0010   # 데스크톱 프런트엔드 React 19 + Zustand 5
    - adr.0011   # MCP stdio 서버는 M2에서 샌드박스 없이 사용자 권한으로 실행
    - adr.0012   # 실행 속도를 앱 크기보다 우선
    - adr.0013   # post.when = next는 붙기만 하고 aside는 L1·CLI 입력 전용
    - adr.0014   # 엔진 바이너리는 단일 xeon
    - adr.0015   # 재실행되는 확장 코드의 효과 목록: 선언형 허용(C안)
    - adr.0016   # 다국어와 로케일: FormatJS, ICU, ko·en
    - adr.0017   # 확장 지점 개정: 자체 이름, collect, 실패 정책 표, 수명주기·가드레일 지점, pi 어댑터 없음
    - adr.0018   # 승인 프로토콜 하나(도구·계획·질문·검토)
    - adr.0019   # 비밀 기본 저장소 SOPS(age)
    - adr.0020   # L4 공유 클라이언트 패키지 packages/client
  layers: "각 층마다 <층>.readme 1개 + 도메인마다 spec, plan (layout.domains 참조)"
