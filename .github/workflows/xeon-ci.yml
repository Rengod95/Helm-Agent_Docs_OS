name: Xeon CI

on:
  push:
    paths:
      - "xeon/**"
      - "docs/xeon/**"
      - "justfile"
      - "scripts/**"
      - ".github/workflows/xeon-ci.yml"
  pull_request:
    paths:
      - "xeon/**"
      - "docs/xeon/**"
      - "justfile"
      - "scripts/**"
      - ".github/workflows/xeon-ci.yml"

concurrency:
  group: xeon-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The jobs together run the steps of `just verify` (xeon/scripts/verify-steps.sh); scripts/ci-alignment.test.ts checks it.
# exit-tests runs the exit-condition tests with their binaries and fails on any skip (product.scope.spec 4.4.1).
# It builds the sidecar binary first when it is missing (E2, E3), so the sidecar e2e tests never skip.
# turbo --affected compares against this ref. Needs fetch-depth 0.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
  TURBO_TELEMETRY_DISABLED: "1"
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/xeon

jobs:
  layer:
    name: layer ${{ matrix.layer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [root, F, X, L0, L1, L2, L3, L4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # L0 sandbox tests and the L4 CLI tests that run a sandboxed command need bubblewrap, socat and rg;
      # Ubuntu 24.04 blocks unprivileged user namespaces by default.
      - if: matrix.layer == 'L0' || matrix.layer == 'L4'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          working_directory: xeon
      # L0 secrets and the L4 CLI secret tests use the real sops and age binaries.
      - if: matrix.layer == 'L0' || matrix.layer == 'L4'
        run: mise use --global sops@3.13.3 age@1.3.2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
        with:
          just-version: "1.58.0"
      - run: just setup
      # main runs everything; branches and PRs run only the packages turbo marks as affected.
      - run: just ci-layer ${{ matrix.layer }} ${{ github.ref_name != 'main' }}

  hygiene:
    name: format, layers, boundaries, unused code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          working_directory: xeon
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
        with:
          just-version: "1.58.0"
      - run: just setup
      - run: just fmt-check
      - run: just check-layers
      - run: just check-ts-rules
      - run: just depcruise
      - run: just knip

  docs:
    name: docs routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          working_directory: xeon
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
        with:
          just-version: "1.58.0"
      - run: just docs-route --check

  exit-tests:
    name: exit-condition tests (no skips)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          working_directory: xeon
      - run: mise use --global sops@3.13.3 age@1.3.2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
        with:
          just-version: "1.58.0"
      - run: just setup
      - run: just exit-tests
