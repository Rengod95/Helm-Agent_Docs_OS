name: Xeon macOS

# Manual macOS run (M2 closing G4-02, review.m2-plan section 8 D1, decision D-d: macOS first). It runs only when asked:
# workflow_dispatch, or a pull request that carries the label ci:macos. Results go to docs/xeon/review/macos-checklist.md.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: xeon-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/xeon

jobs:
  macos:
    name: macOS arm64 checks
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:macos')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          working_directory: xeon
      # Seatbelt tests (srt) need rg.
      - run: mise use --global sops@3.13.3 age@1.3.2 ripgrep@15.0.0
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
        with:
          just-version: "1.58.0"
      - run: just setup
      # Checklist rows M-01 (FTS5, fullfsync, locks), M-02 (NFD paths), M-03 (Seatbelt), M-04 (secrets).
      - name: platform-store (FTS5 trigram probe, fullfsync, locks)
        run: just test packages/platform-store
      - name: platform-os (paths, NFD)
        if: always()
        run: just test packages/platform-os
      - name: platform-sandbox (Seatbelt)
        if: always()
        run: just test packages/platform-sandbox
      - name: platform-secrets (sops, keychain fallback)
        if: always()
        run: just test packages/platform-secrets
      - name: cap-knowledge (FTS5 search)
        if: always()
        run: just test packages/cap-knowledge
      - name: exit-condition tests
        if: always()
        run: just exit-tests
      # Checklist rows M-07 (sidecar build) and M-08 (Tauri shell tests).
      - name: sidecar aarch64-apple-darwin
        if: always()
        run: just desktop-sidecar aarch64-apple-darwin
      - name: desktop Rust shell tests
        if: always()
        run: just desktop-test
