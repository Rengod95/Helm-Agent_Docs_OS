avoid_as_default_ui_labels:
  Normative: 방향
  Epistemic: 이해
  Material: 실제 변화
  Concern: 초점
  ProblemFrame: 문제 관점
  Hypothesis: 가능성
  Claim: 판단
  Commitment: 약속
  DelegationContract: 작업 합의
  AuthorityEnvelope: 맡긴 범위
  WorkUnit: 진행 작업
  Acceptance: 결과 확인
  Integration: 전체 반영
  Assurance: 근거 검토
