schema: helm.product-language.v0
locale: ko-KR
status: working-draft

authority:
  semantic_source: ../foundations/README.md
  product_language_source: README.md
  rule: >-
    의미와 안전 규칙은 semantic_source를 따르고, 사용자에게 보이는 이름과
    application-layer domain은 이 vocabulary를 따른다.

terms:
  goal:
    domain: Goal
    label: 목표
    foundation: Purpose
    question: 우리가 이루려는 것은 무엇인가?
  focus:
    domain: Focus
    label: 초점
    foundation: Concern
    question: 지금 함께 풀고 있는 중요한 상황은 무엇인가?
  current_picture:
    domain: CurrentPicture
    label: 현재 상황
    foundation: SituationModel
    question: 지금 실제로 어떤 상태인가?
  problem_view:
    domain: ProblemView
    label: 문제 관점
    foundation: ProblemFrame
    question: 이 상황에서 무엇을 문제로 보고 있는가?
  observation:
    domain: Observation
    label: 관찰
    foundation: Observation
    question: 무엇을 직접 확인했는가?
  interpretation:
    domain: Interpretation
    label: 해석
    foundation: Inference
    question: 관찰을 어떻게 이해하고 있는가?
  possibility:
    domain: Possibility
    label: 가능성
    foundation: Hypothesis
    question: 어떤 설명이나 해법을 확인 중인가?
  finding:
    domain: Finding
    label: 판단
    foundation: Claim
    question: 지금 무엇을 참으로 받아들이는가?
  evidence:
    domain: Evidence
    label: 근거
    foundation: Evidence
    question: 무엇이 이 판단을 지지하거나 약화하는가?
  challenging_evidence:
    domain: ChallengingEvidence
    label: 반대 근거
    foundation: Counterevidence
    question: 무엇이 이 판단과 맞지 않는가?
  assumption:
    domain: Assumption
    label: 전제
    foundation: Assumption
    question: 아직 확인하지 않고 임시로 믿는 것은 무엇인가?
  open_question:
    domain: OpenQuestion
    label: 아직 모르는 점
    foundation: Uncertainty
    question: 무엇을 알면 선택이 달라질 수 있는가?
  choice:
    domain: Choice
    label: 선택
    foundation: Decision
    question: 앞으로 무엇을 하기로 정했는가?
  result_condition:
    domain: ResultCondition
    label: 완료 기준
    foundation: AcceptanceCriterion
    question: 어떤 상태가 되면 결과를 받아들일 수 있는가?
  review_trigger:
    domain: ReviewTrigger
    label: 다시 볼 조건
    foundation: ReopenTrigger
    question: 어떤 변화가 생기면 이 선택을 다시 검토할까?
  promise:
    domain: Promise
    label: 약속
    foundation: Commitment
    question: 누가 무엇을 맡았는가?
  work_agreement:
    domain: WorkAgreement
    label: 작업 합의
    foundation: DelegationContract
    question: 무엇을 왜 어디까지 어떤 조건으로 맡겼는가?
  allowed_range:
    domain: AllowedRange
    label: 맡긴 범위
    foundation: AuthorityEnvelope
    question: 무엇을 스스로 해도 되고 언제 멈춰야 하는가?
  work:
    domain: Work
    label: 진행 작업
    foundation: WorkUnit
    question: 지금 실행 중인 구체적인 일은 무엇인가?
  result_submission:
    domain: ResultSubmission
    label: 결과 제출
    foundation: CompletionClaim
    question: 일을 맡은 쪽이 무엇을 끝냈다고 말하는가?
  result_review:
    domain: ResultReview
    label: 결과 확인
    foundation: Acceptance
    question: 제출된 결과를 현재 범위에서 받아들여도 되는가?
  result:
    domain: Result
    label: 실제 결과
    foundation: Outcome
    question: 실행 뒤 현실에서 무엇이 달라졌는가?
  whole_update:
    domain: WholeUpdate
    label: 전체 반영
    foundation: Integration
    question: 다른 작업과 기준까지 일관되게 갱신했는가?
  learning_review:
    domain: LearningReview
    label: 돌아보기
    foundation: Reflection
    question: 다음에는 무엇을 다르게 할 것인가?
  brief:
    domain: Brief
    label: 복귀 요약
    foundation: ReturnBrief
    question: 돌아온 뒤 무엇이 달라졌고 지금 무엇을 해야 하는가?
  choice_request:
    domain: ChoiceRequest
    label: 선택 요청
    foundation: DecisionGate
    question: 사람의 선택이 지금 결과를 어떻게 바꾸는가?
  change_record:
    domain: ChangeRecord
    label: 변화 기록
    foundation: Event
    question: 누가 언제 무엇을 왜 바꿨는가?
  automation_rule:
    domain: AutomationRule
    label: 자동화 규칙
    foundation: Policy
    question: 무엇을 자동 처리하고 언제 사람에게 물을 것인가?
  boundary:
    domain: Boundary
    label: 지켜야 할 조건
    foundation: Constraint
    question: 실행 중 무엇을 바꾸거나 위반하면 안 되는가?
  human_owner:
    domain: HumanOwner
    label: 사람 책임자
    foundation: HumanActor
    question: 목표와 결과에 대한 책임을 계속 가진 사람은 누구인가?
  agent_delegate:
    domain: AgentDelegate
    label: Agent 담당
    foundation: AgentActor
    question: 맡긴 범위 안에서 실제 일을 수행하는 agent는 누구인가?
  reviewer:
    domain: Reviewer
    label: 결과 확인자
    foundation: Acceptor
    question: 결과를 받아들일 권한이 있는 사람 또는 규칙은 무엇인가?

navigation:
  - id: today
    label: 오늘
    purpose: 돌아온 뒤 달라진 점과 지금 할 일
  - id: focuses
    label: 초점
    purpose: 함께 풀고 있는 중요한 상황
  - id: work
    label: 진행 작업
    purpose: 사람과 agent가 맡은 일
  - id: choices
    label: 선택
    purpose: 열린 선택 요청과 선택 기록
  - id: evidence
    label: 근거
    purpose: 판단과 결과를 지지하거나 약화하는 자료
  - id: automation_rules
    label: 자동화 규칙
    purpose: 맡긴 범위, 알림, 연결, 보관 기준

work_statuses:
  proposed: 준비 중
  negotiating: 범위 확인 중
  delegated: 맡김 완료
  in_progress: 진행 중
  claiming_complete: 결과 확인 필요
  accepted: 결과 확인됨
  integrating: 전체에 반영 중
  integrated: 완료
  blocked: 막힘
  correction_required: 수정 필요
  suspended: 잠시 멈춤
  reopened: 다시 열림
  cancelled: 취소됨
  superseded: 다른 작업으로 대체됨

choice_statuses:
  framing: 질문 정리 중
  reviewing_options: 선택지 검토 중
  choice_needed: 선택 필요
  chosen: 선택됨
  applying: 적용 중
  result_checked: 결과 확인됨
  integrated: 전체 반영됨

