# Hooks for xeon/. Lefthook only reads the git root, so the root lefthook.yml extends this file.
# oxfmt and oxlint run under ../scripts/guard.sh run (1.5G each, shared ws-dev.slice budget) so concurrent commits stay inside it.
# Install once from anywhere in the repo: `lefthook install`.
pre-commit:
  parallel: false
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner
    oxfmt-check:
      root: xeon/
      glob: "**/*.{ts,tsx,js,mjs,cjs,json,jsonc}"
      exclude: "vendor/**"
      run: ../scripts/guard.sh run -- mise exec -- bunx oxfmt --check -c .oxfmtrc.json {staged_files}
    oxlint:
      root: xeon/
      glob: "**/*.{ts,tsx,js,mjs,cjs}"
      # 셸 목업(apps/desktop/mockups)은 oxlint 대상이 아니다(.oxlintrc.json ignorePatterns)
      exclude:
        - "vendor/**"
        - "apps/desktop/mockups/**"
        - "xeon/apps/desktop/mockups/**"
      run: ../scripts/guard.sh run -- mise exec -- bunx oxlint --type-aware --deny-warnings -c .oxlintrc.json {staged_files}
