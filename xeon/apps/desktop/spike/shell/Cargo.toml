[package]
name = "spike-shell"
version = "0.0.0"
edition = "2021"
publish = false

# 측정용 spike. 제품 코드가 아니다 (docs/xeon/L4/desktop/plan.md §3.1.1).
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-shell = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["time"] }
