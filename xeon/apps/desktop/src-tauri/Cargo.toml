[package]
name = "fresnel-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "=2.5.0"
# 폴더 선택 창(folder_pick.rs). WebView에는 dialog 권한을 주지 않고 Rust의 pick_folder 명령이 부른다.
tauri-plugin-dialog = "=2.8.4"
# 앱 업데이트(updater.rs). 서명 공개키와 배포 주소가 tauri.conf.json에 비어 있으면 등록하지 않는다(B-10, 사용자 승인 2026-11-06).
tauri-plugin-updater = "=2.14.1"
# OS 알림(notify_os.rs). WebView에는 notification 권한을 주지 않고 Rust 명령이 부른다(B-10).
tauri-plugin-notification = "=2.8.0"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-log = "=2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net", "io-util"] }
memchr = "2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

# 디버그 전용 WKWebView 뷰포트 스냅샷(src/inspect). 릴리스 빌드는 이 코드를 컴파일하지 않는다.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }
# 사람 재인증 명령 os_reauth(os_reauth.rs). LAContext.evaluatePolicy만 쓴다. 기본 기능(objc2-security 등)은 끈다
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["LAContext", "block2"] }

[dev-dependencies]
tauri = { version = "=2.12.3", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }

# 실제 WebView에서 fresnel-view:// 프레임이 IPC에 닿는지 본다(ADR-0021 3.6.2). 창을 띄우므로 `just desktop-ipc-probe`로만 돌리고 `cargo test` 기본 묶음에는 넣지 않는다.
[[test]]
name = "ipc_probe"
path = "tests/ipc_probe.rs"
harness = false
test = false
