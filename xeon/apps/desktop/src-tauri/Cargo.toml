[package]
name = "xeon-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-shell = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
memchr = "2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
