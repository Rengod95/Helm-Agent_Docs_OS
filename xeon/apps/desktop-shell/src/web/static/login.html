<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Fresnel</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#101216" />
    <link rel="manifest" href="/brand/site.webmanifest" />
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <main class="card">
      <header class="head">
        <img
          class="logo"
          src="/brand/logo/fresnel-logo-32@2x.png"
          srcset="/brand/logo/fresnel-logo-32@2x.png 2x, /brand/logo/fresnel-logo-32@3x.png 3x"
          width="32"
          height="32"
          alt=""
        />
        <div>
          <h1 id="title">Fresnel</h1>
          <p id="subtitle" class="subtitle"></p>
        </div>
      </header>
      <form id="pair-form" novalidate>
        <label id="code-label" for="code"></label>
        <input
          id="code"
          name="code"
          type="text"
          inputmode="text"
          autocomplete="one-time-code"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
          maxlength="64"
          placeholder="ABCDE-12345"
          aria-describedby="code-error"
          required
        />
        <p id="code-error" class="error" role="alert" hidden></p>
        <label id="name-label" for="device-name"></label>
        <input
          id="device-name"
          name="deviceName"
          type="text"
          autocomplete="off"
          maxlength="64"
          aria-describedby="name-error"
          required
        />
        <p id="name-error" class="error" role="alert" hidden></p>
        <button id="submit" type="submit"></button>
        <p id="message" class="error" role="alert" hidden></p>
      </form>
      <p id="footer" class="footer"></p>
      <noscript><p class="error">JavaScript is required to connect.</p></noscript>
    </main>
    <script src="/login.js" defer></script>
  </body>
</html>
