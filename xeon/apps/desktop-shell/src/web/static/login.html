<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Fresnel</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/site.webmanifest" />
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <main class="card">
      <img
        class="logo"
        src="/brand/logo/fresnel-logo-32@2x.png"
        srcset="/brand/logo/fresnel-logo-32@2x.png 2x, /brand/logo/fresnel-logo-32@3x.png 3x"
        width="40"
        height="40"
        alt=""
      />
      <h1 id="title">Fresnel</h1>
      <form id="pair-form" novalidate>
        <label id="code-label" for="code"></label>
        <input
          id="code"
          name="code"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
          maxlength="64"
          required
        />
        <p id="code-hint" class="hint"></p>
        <label id="name-label" for="device-name"></label>
        <input
          id="device-name"
          name="deviceName"
          type="text"
          autocomplete="off"
          maxlength="256"
          required
        />
        <button id="submit" type="submit"></button>
      </form>
      <p id="message" class="message" role="alert" hidden></p>
      <noscript><p>JavaScript is required to connect.</p></noscript>
    </main>
    <script src="/login.js" defer></script>
  </body>
</html>
